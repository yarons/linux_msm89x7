%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/qcom,dsi-phy-12nm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Display DSI 12nm PHY

maintainers:
  - Krishna Manikandan <quic_mkrishn@quicinc.com>

description:
  DSI PHY and PLL found on SDM429 and SDM439. Unlike on the other Qualcomm DSI
  PHYs the PLL registers do not have a block of their own, they are
  interleaved with the PHY registers, so the dsi_pll and dsi_phy regions
  overlap.

allOf:
  - $ref: qcom,dsi-phy-common.yaml#

properties:
  compatible:
    enum:
      - qcom,dsi-phy-12nm

  reg:
    minItems: 2
    items:
      - description: dsi pll register set
      - description: dsi phy register set
      - description:
          Not part of the PHY and not used. The 12nm PHY has no regulator
          registers. Existing device trees list the MMSS misc block (DSI ULPS
          clamp and PHY reset controls) here under the name that the 28nm PHY
          node they override uses for its regulator registers; the entry is
          only accepted for their sake and should be left out of new ones.

  reg-names:
    minItems: 2
    items:
      - const: dsi_pll
      - const: dsi_phy
      - const: dsi_phy_regulator

  vddio-supply:
    description: Phandle to vdd-io regulator device node.

required:
  - compatible
  - reg
  - reg-names
  - vddio-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-msm8917.h>
    #include <dt-bindings/clock/qcom,rpmcc.h>

    dsi-phy@1a94400 {
        compatible = "qcom,dsi-phy-12nm";
        reg = <0x01a94400 0x400>,
              <0x01a94400 0x400>;
        reg-names = "dsi_pll",
                    "dsi_phy";

        #clock-cells = <1>;
        #phy-cells = <0>;

        vddio-supply = <&vddio_reg>;

        clocks = <&gcc GCC_MDSS_AHB_CLK>,
                 <&rpmcc RPM_SMD_XO_CLK_SRC>;
        clock-names = "iface", "ref";
    };
...
