%YAML 1.2
---
$id: http://devicetree.org/schemas/extcon/qcom,pmi632-uusb-extcon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SMB5 PMIC micro-USB ID detection

maintainers:
  - Yaron Shahrabani <yarons@users.noreply.github.com>

description:
  On boards with a micro-USB receptacle the Type-C block of Qualcomm PMICs
  with an SMB5 charger, such as PMI632, runs in micro USB mode and reports
  the state of the ID pin. This describes the block in that mode, as an
  extcon provider for USB OTG adapter detection. Boards with a Type-C
  receptacle use qcom,pmi632-typec for the same registers instead.

properties:
  compatible:
    const: qcom,pmi632-uusb-extcon

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: ID state change (the block's or-rid-detect-change interrupt)

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic {
        #address-cells = <1>;
        #size-cells = <0>;

        extcon@1500 {
            compatible = "qcom,pmi632-uusb-extcon";
            reg = <0x1500>;
            interrupts = <0x2 0x15 0x00 IRQ_TYPE_EDGE_RISING>;
        };
    };
...
