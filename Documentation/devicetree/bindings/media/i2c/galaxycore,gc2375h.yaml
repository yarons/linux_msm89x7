%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/galaxycore,gc2375h.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GalaxyCore GC2375H 1/5" 2M Pixel MIPI CSI-2 sensor

maintainers:
  - Yaron Shahrabani <yarons@users.noreply.github.com>

description:
  The GC2375H is a raw image sensor with a 1600x1200 pixel array, a MIPI
  CSI-2 image data interface with one data lane and an I2C compatible
  control bus. The output format is 10 bit raw Bayer.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: galaxycore,gc2375h

  reg:
    maxItems: 1

  clocks:
    description: Reference to the master clock, 19.2 MHz or 24 MHz.
    maxItems: 1

  dovdd-supply:
    description: Digital I/O supply (IOVDD), 1.8 V.

  avdd-supply:
    description: Analog supply (AVDD), 2.8 V.

  dvdd-supply:
    description:
      Digital core supply (DVDD), 1.8 V. Camera modules may feed it from the
      I/O supply.

  reset-gpios:
    description: Reference to the GPIO connected to the RESETB pin.
    maxItems: 1

  powerdown-gpios:
    description:
      Reference to the GPIO connected to the PWDN pin. The sensor is in
      power down mode while the pin is high.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    description:
      Output port node, single endpoint describing the CSI-2 transmitter.

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1

          link-frequencies:
            description:
              364800000 Hz with a 19.2 MHz master clock, 312000000 Hz with a
              24 MHz master clock.

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - dovdd-supply
  - avdd-supply
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        sensor@17 {
            compatible = "galaxycore,gc2375h";
            reg = <0x17>;

            clocks = <&gc2375h_clk>;

            reset-gpios = <&tlmm 38 GPIO_ACTIVE_LOW>;
            powerdown-gpios = <&tlmm 128 GPIO_ACTIVE_HIGH>;

            avdd-supply = <&gc2375h_avdd>;
            dovdd-supply = <&gc2375h_dovdd>;

            orientation = <0>;
            rotation = <270>;

            port {
                endpoint {
                    data-lanes = <1>;
                    link-frequencies = /bits/ 64 <364800000>;
                    remote-endpoint = <&csiphy1_ep>;
                };
            };
        };
    };

...
