%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/giantec,gt9772.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Giantec GT9772 Voice Coil Motor (VCM) Lens Driver

maintainers:
  - Yaron Shahrabani <yarons@users.noreply.github.com>

description:
  The Giantec GT9772 is a 10 bit digital-to-analog converter with a current
  sink output and ringing control, used to drive the voice coil motor of
  camera lenses. It is controlled over I2C.

properties:
  compatible:
    const: giantec,gt9772

  reg:
    maxItems: 1

  vdd-supply:
    description: Power supply of the driver and the voice coil.

required:
  - compatible
  - reg
  - vdd-supply

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        lens@c {
            compatible = "giantec,gt9772";
            reg = <0x0c>;
            vdd-supply = <&pm8953_l17>;
        };
    };
...
