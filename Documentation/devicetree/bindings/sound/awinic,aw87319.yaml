%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/awinic,aw87319.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW87319 Audio Amplifier

maintainers:
  - Yaron Shahrabani <yarons@users.noreply.github.com>

description:
  The Awinic AW87319 is a mono class-D speaker amplifier with an integrated
  boost converter and a multi-level AGC. It has an analog input and is
  configured through a handful of I2C registers, there is no digital audio
  interface. The reset pin holds the chip in shutdown while it is low.

allOf:
  - $ref: component-common.yaml#

properties:
  compatible:
    const: awinic,aw87319

  reg:
    maxItems: 1

  reset-gpios:
    description:
      GPIO connected to the reset pin (active low). The chip is in hardware
      shutdown and does not answer on I2C while the line is low.
    maxItems: 1

  sound-name-prefix: true

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        audio-amplifier@58 {
            compatible = "awinic,aw87319";
            reg = <0x58>;
            reset-gpios = <&tlmm 39 GPIO_ACTIVE_LOW>;
            sound-name-prefix = "Speaker Amp Left";
        };
    };
